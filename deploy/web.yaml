# HeyGem 前端（nginx 静态资源 + /api 反代）
apiVersion: v1
kind: Service
metadata:
  name: heygem-web
spec:
  selector:
    app: heygem-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heygem-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heygem-web
  template:
    metadata:
      labels:
        app: heygem-web
    spec:
      containers:
        - name: web
          image: heygem/web:3.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
