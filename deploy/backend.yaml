# HeyGem 后端服务（FastAPI + 内嵌 worker）
# 单机形态：SQLite 落在 data 卷内；多实例形态请把 HEYGEM_DATABASE_URL 指向 PostgreSQL
# 并关闭除 worker 实例外的 HEYGEM_WORKER_ENABLED。
apiVersion: v1
kind: Service
metadata:
  name: heygem-backend
spec:
  selector:
    app: heygem-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heygem-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heygem-backend
  template:
    metadata:
      labels:
        app: heygem-backend
    spec:
      containers:
        - name: backend
          image: heygem/backend:3.0.0
          command: ["python", "main.py"]
          ports:
            - containerPort: 8000
          env:
            - name: HEYGEM_APP_ENV
              value: "production"
            - name: HEYGEM_AI_MODE
              value: "live"
            - name: HEYGEM_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: heygem-secrets
                  key: jwt-secret
            - name: HEYGEM_DATA_ROOT
              value: "/app/data"
            - name: HEYGEM_DATABASE_URL
              value: "sqlite+aiosqlite:////app/data/db/app.db"
            - name: HEYGEM_TTS_BASE_URL
              value: "http://heygem-tts:18180"
            - name: HEYGEM_F2F_BASE_URL
              value: "http://heygem-f2f:8383"
            - name: HEYGEM_ASR_BASE_URL
              value: "http://heygem-asr:10095"
            - name: HEYGEM_TTS_HANDOFF_DIR
              value: "/app/data/handoff/tts"
            - name: HEYGEM_F2F_HANDOFF_DIR
              value: "/app/data/handoff/f2f"
            - name: HEYGEM_WORKER_ENABLED
              value: "true"
            - name: HEYGEM_WORKER_CONCURRENCY
              value: "1"
            - name: HEYGEM_CORS_ORIGINS
              value: "https://heygem.example.com"
          volumeMounts:
            - name: heygem-data
              mountPath: /app/data
            - name: tts-data
              mountPath: /app/data/handoff/tts
            - name: f2f-temp
              mountPath: /app/data/handoff/f2f
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: heygem-data
          persistentVolumeClaim:
            claimName: heygem-data
        - name: tts-data
          hostPath:
            path: /opt/heygem/voice/data
        - name: f2f-temp
          hostPath:
            path: /opt/heygem/face2face/temp
