# HeyGem 单机编排：后端（API + worker）+ 前端 nginx + 三个 AI 服务
# 用法：
#   docker compose up -d                      # 生产（live 模式，需 AI 服务可用）
#   HEYGEM_AI_MODE=mock docker compose up -d  # 演示（无需 AI 服务，产物为占位素材）
services:
  heygem-backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    image: heygem/backend:3.0.0
    command: ["python", "main.py"]
    environment:
      HEYGEM_APP_ENV: "production"
      HEYGEM_AI_MODE: "${HEYGEM_AI_MODE:-live}"
      HEYGEM_ALLOW_MOCK_IN_PRODUCTION: "${HEYGEM_ALLOW_MOCK_IN_PRODUCTION:-false}"
      HEYGEM_JWT_SECRET: "${HEYGEM_JWT_SECRET:?请设置 HEYGEM_JWT_SECRET（生产必填）}"
      HEYGEM_DATA_ROOT: "/app/data"
      HEYGEM_DATABASE_URL: "sqlite+aiosqlite:////app/data/db/app.db"
      HEYGEM_TTS_BASE_URL: "http://heygem-tts:18180"
      HEYGEM_F2F_BASE_URL: "http://heygem-f2f:8383"
      HEYGEM_ASR_BASE_URL: "http://heygem-asr:10095"
      HEYGEM_TTS_HANDOFF_DIR: "/app/data/handoff/tts"
      HEYGEM_F2F_HANDOFF_DIR: "/app/data/handoff/f2f"
      HEYGEM_WORKER_ENABLED: "true"
      HEYGEM_WORKER_CONCURRENCY: "1"
      HEYGEM_CORS_ORIGINS: "${HEYGEM_CORS_ORIGINS:-http://localhost:8080}"
    ports:
      - "8000:8000"
    volumes:
      - heygem-data:/app/data
      - ./volumes/tts:/app/data/handoff/tts
      - ./volumes/f2f:/app/data/handoff/f2f
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  heygem-web:
    build:
      context: ../web
      dockerfile: ../deploy/Dockerfile.web
    image: heygem/web:3.0.0
    ports:
      - "8080:80"
    depends_on:
      - heygem-backend
    restart: unless-stopped

  # ---- AI 服务（镜像由外部提供；源码不在本仓库） ----
  heygem-tts:
    image: heygem/tts:latest
    ports:
      - "18180:18180"
    volumes:
      - ./volumes/tts:/code/data
    restart: unless-stopped

  heygem-f2f:
    image: heygem/f2f:latest
    ports:
      - "8383:8383"
    volumes:
      - ./volumes/f2f:/code/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  heygem-asr:
    image: heygem/asr:latest
    ports:
      - "10095:10095"
    restart: unless-stopped

volumes:
  heygem-data:
